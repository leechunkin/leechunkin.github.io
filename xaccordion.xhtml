<?xml version='1.0' encoding='UTF-8' standalone='yes'?>
<html xmlns='http://www.w3.org/1999/xhtml'>
	<title>X-Accordion (chromatic button)</title>
	<head>
		<script type='text/javascript'>
			<![CDATA[

void function () {
	if (document.readyState !== "loading") return this();
	else return document.addEventListener("DOMContentLoaded", this);
}.call(
	function () {
		"use strict";
		document.body.removeChild(document.getElementsByTagName("noscript").item(0));
		if (typeof AudioContext === "undefined")
			return (
				function (h1) {
					h1.appendChild(document.createTextNode("Web Audio is required"));
					document.body.appendChild(h1);
				}(document.createElement("h1"))
			);
		var keycode = new Map([
			["Digit1",       [1, 1]],
			["Digit2",       [1, 2]],
			["Digit3",       [1, 3]],
			["Digit4",       [1, 4]],
			["Digit5",       [1, 5]],
			["Digit6",       [1, 6]],
			["Digit7",       [1, 7]],
			["Digit8",       [1, 8]],
			["Digit9",       [1, 9]],
			["Digit0",       [1, 10]],
			["Minus",        [1, 11]],
			["Equal",        [1, 12]],
			["KeyQ",         [2, 1]],
			["KeyW",         [2, 2]],
			["KeyE",         [2, 3]],
			["KeyR",         [2, 4]],
			["KeyT",         [2, 5]],
			["KeyY",         [2, 6]],
			["KeyU",         [2, 7]],
			["KeyI",         [2, 8]],
			["KeyO",         [2, 9]],
			["KeyP",         [2, 10]],
			["BracketLeft",  [2, 11]],
			["BracketRight", [2, 12]],
			["KeyA",         [3, 1]],
			["KeyS",         [3, 2]],
			["KeyD",         [3, 3]],
			["KeyF",         [3, 4]],
			["KeyG",         [3, 5]],
			["KeyH",         [3, 6]],
			["KeyJ",         [3, 7]],
			["KeyK",         [3, 8]],
			["KeyL",         [3, 9]],
			["Semicolon",    [3, 10]],
			["Quote",        [3, 11]],
			["KeyZ",         [4, 1]],
			["KeyX",         [4, 2]],
			["KeyC",         [4, 3]],
			["KeyV",         [4, 4]],
			["KeyB",         [4, 5]],
			["KeyN",         [4, 6]],
			["KeyM",         [4, 7]],
			["Comma",        [4, 8]],
			["Period",       [4, 9]],
			["Slash",        [4, 10]]
		]);
		function tone_frequency(note) {
			return 440 * Math.pow(2, note / 12);
		}
		function key_tone(keycode) {
			var tone = (keycode[0]-3)*keyboard_type + (keycode[1]-1)*3 - 12;
			return tone;
		}
		var keyboard_type = 2; /* 2 for type C, 1 for type B */
		var waveform = "sawtooth";
		var audio = {
			context: null,
			gain: null,
			initialize() {
				if (this.context != null && this.gain != null) return;
				this.context = new AudioContext;
				this.gain = this.context.createGain();
				this.gain.gain.value = 0.5;
				this.gain.connect(this.context.destination);
			},
			oscillator(frequency) {
				var oscillator = this.context.createOscillator();
				oscillator.type = waveform;
				oscillator.frequency.value = frequency;
				oscillator.connect(this.gain);
				return oscillator;
			},
			modify_gain(f) {
				this.gain.gain.value = f(this.gain.gain.value);
			}
		};
		var actions = new Map;
		var action = {
			oscillator: null,
			initialize(oscillator) {
				this.oscillator = oscillator;
				return this;
			}
		};
		document.addEventListener(
			"pointermove",
			function (event) {
				audio.modify_gain(
					function () {
						return 1 - event.clientY / window.innerHeight;
					}
				);
			}
		);
		document.addEventListener(
			"keydown",
			function (event) {
				audio.initialize();
				var code = event.code;
				switch (code) {
					case "Backspace":
						audio.modify_gain(
							function (gain) {
								return Math.min(1, gain + 0.05);
							}
						);
						break;
					case "Enter":
						audio.modify_gain(
							function (gain) {
								return Math.max(0, gain - 0.05);
							}
						);
						break;
					case "F1":
						waveform = "sine";
						break;
					case "F2":
						waveform = "triangle";
						break;
					case "F3":
						waveform = "sawtooth";
						break;
					case "F4":
						waveform = "square";
						break;
					case "Backslash":
						keyboard_type = 3 - keyboard_type;
						break;
					default:
						var position = keycode.get(code);
						if (position === undefined) return;
						if (event.repeat) break;
						if (actions.has(code)) break;
						var oscillator = audio.oscillator(tone_frequency(key_tone(position)));
						oscillator.start();
						actions.set(code, Object.create(action).initialize(oscillator));
				}
				event.preventDefault();
			}
		);
		document.addEventListener(
			"keyup",
			function (event) {
				var code = event.code;
				var action = actions.get(code);
				if (!action) return;
				actions.delete(code);
				if (action.oscillator != null) {
					action.oscillator.stop();
					action.oscillator.disconnect();
				}
			}
		);
		document.addEventListener(
			"blur",
			function () {
				actions.forEach(
					function (action) {
						action.oscillator.stop();
						action.oscillator.disconnect();
					}
				);
				return actions.clear();
			}
		);
	}
);

			]]>
		</script>
		<style type='text/css'>
			body {
				writing-mode: vertical-rl;
			}
			noscript {
				position: fixed;
				z-index: 1;
				transform: translate(0, 50vh) translate(-50%, -50%);
				border-style: double;
				border-width: thick;
				border-color: black;
				writing-mode: horizontal-tb;
				padding: 2ex;
				background: lightgray;
				color: red;
				text-align: center;
			}
			p::before {
				content: "　　"
			}
			li {
				margin: 0.5em;
			}
			code {
				background-color: lightgray;
				padding: 0.5ex;
				color: black;
				writing-mode: horizontal-tb;
			}
		</style>
	</head>
	<body>
		<noscript>
			<h1>你的瀏覽器並沒有提供這網頁需要的 Javascript 和 Web Audio</h1>
		</noscript>
		<h1>摸擬按鈕式手風琴</h1>
		<p>
			這個程式用電腦鍵盤模擬按鈕式手風琴右手部分。
			鍵盤上的字母鍵及大部分符號鍵都是用來發出聲音。
			其他功能鍵如下：
		</p>
		<ul>
			<li><code>F1</code>：更改音色為正弦波。</li>
			<li><code>F2</code>：更改音色為三角波。</li>
			<li><code>F3</code>：更改音色為鋸齒波。</li>
			<li><code>F4</code>：更改音色為方波。</li>
			<li>反斜線<code>\</code>：更改音色為方波。</li>
			<li>退回鍵：增加音量。</li>
			<li>回車鍵：減低音量。</li>
		</ul>
		<p>
			滑鼠可以用來控制音量，移動到頁面上方音量增大，到頁面下方音量減小。
		</p>
	</body>
</html>
